{% extends "base.html" %}


{% block title %}
Error — Port Sentinel
{% endblock %}


{% block content %}

<div class="center-page">


    <section class="error-card liquid-card">


        <div class="error-symbol">
            !
        </div>


        <div class="eyebrow">
            PORT SENTINEL / SYSTEM MESSAGE
        </div>


        <h1>
            Something went wrong.
        </h1>


        <p>
            {{ message }}
        </p>


        <a
            href="{{ url_for('home') }}"
            class="primary-liquid-button"
        >

            <span>
                Return to dashboard
            </span>

            <strong>
                →
            </strong>

        </a>


    </section>


</div>

{% endblock %}
